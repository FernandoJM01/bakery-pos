name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @redocly/cli@1.25.11 lint contracts/openapi.yaml

  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos_ci_only
          POSTGRES_DB: pos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pos -d pos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pos_app:pos_app_ci_only@localhost:5432/pos_test
      MIGRATION_DATABASE_URL: postgres://pos:pos_ci_only@localhost:5432/pos_test
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      DEVICE_TOKEN_PEPPER: ci-only-pepper-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npx tsc --noEmit
      - run: npm test -- --coverage
      - name: Deploy migrations and enable pos_app login
        run: |
          DATABASE_URL=$MIGRATION_DATABASE_URL npx prisma migrate deploy
          DATABASE_URL=$MIGRATION_DATABASE_URL node -e "const { PrismaClient } = require('@prisma/client'); const p = new PrismaClient(); p.\$executeRawUnsafe(\"ALTER ROLE pos_app WITH LOGIN PASSWORD 'pos_app_ci_only'\").then(() => p.\$disconnect());"
      - run: npm run test:e2e
      - run: npm audit --audit-level=high

  app:
    name: App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - run: flutter build web --release --target lib/main_backoffice.dart
      - run: bash tool/check_web_bundle.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: flutter build apk --debug --target lib/main_till.dart

  app-integration:
    name: App integration (emulator)
    # Till acceptance tests A15 (offline login and lockout) and A16 (auto-lock
    # and restore) on a real Android emulator, tablet-sized like the tills.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          working-directory: app
          script: flutter test integration_test -d emulator-5554

  deploy:
    name: Docker image and local server stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for arm64 (Raspberry Pi 5 / ARM mini PC)
        run: |
          docker buildx build --platform linux/arm64 --target runtime --load -t pos-server-arm64 server
          # sharp ships native code per platform; prove the arm64 build loads it.
          docker run --rm --platform linux/arm64 pos-server-arm64 \
            node -e "require('sharp')({create:{width:2,height:2,channels:3,background:'red'}}).webp().toBuffer().then(() => console.log('sharp ok'))"
      - name: Start the stack (amd64)
        working-directory: deploy
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "POS_APP_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "DEVICE_TOKEN_PEPPER=$(openssl rand -hex 32)"
          } > .env
          mkdir -p backoffice backups && echo ok > backoffice/index.html
          docker compose up -d --build --wait --wait-timeout 180 db server web
      - name: Smoke test the built image
        working-directory: deploy
        run: |
          set -e
          curl -fsS http://127.0.0.1:8080/health | grep '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/branches)" = 403
          printf 'CI Owner\nOwner\nci-owner@bakery.local\nCiOwnerPass123!\n4321\n' |
            docker compose exec -T server node dist/cli/create-owner.js
          token=$(curl -fsS -H 'X-Forwarded-Proto: https' -H 'Content-Type: application/json' \
            -d '{"email":"ci-owner@bakery.local","password":"CiOwnerPass123!"}' \
            http://127.0.0.1:8080/v1/auth/password-login | jq -r .accessToken)
          test -n "$token" && test "$token" != null
          ! docker compose logs server | grep -q 'CiOwnerPass123'
          # C15: a product photo goes through nginx, is stored on the volume
          # and comes back as WebP.
          # A 1000 x 1000 noise PNG (about 3 MB, over nginx's default 1 MB).
          python3 - <<'PY' > photo.png
          import os, struct, sys, zlib
          w = h = 1000
          rows = b"".join(b"\0" + os.urandom(w * 3) for _ in range(h))
          def chunk(t, d):
              return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d))
          sys.stdout.buffer.write(b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0))
              + chunk(b"IDAT", zlib.compress(rows, 1)) + chunk(b"IEND", b""))
          PY
          photo_id=$(curl -fsS -H 'X-Forwarded-Proto: https' -H "Authorization: Bearer $token" \
            -F file=@photo.png http://127.0.0.1:8080/v1/photos | jq -r .id)
          curl -fsS -o got.webp -H 'X-Forwarded-Proto: https' "http://127.0.0.1:8080/v1/photos/$photo_id"
          test "$(head -c 4 got.webp)" = RIFF
          echo "$photo_id" > photo-id.txt
      - name: Backup and restore test
        working-directory: deploy
        run: |
          docker compose up -d backup
          docker compose exec -T backup sh /backup.sh now
          ./restore-test.sh | tee restore-test.log
          grep -q '^photo|[1-9]' restore-test.log
          sudo tar -tzf backups/photos-*.tar.gz | grep -qx "./$(cat photo-id.txt).webp"
      - if: failure()
        working-directory: deploy
        run: docker compose logs
