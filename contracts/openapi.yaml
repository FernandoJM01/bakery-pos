openapi: 3.1.0
info:
  title: Bakery POS API
  version: 0.8.0-m7
  description: |
    Contract for Milestones 1 (foundation, access, roles, devices), 2 (catalog and sync), 3 (sales), 4 (cash shifts, audit and printing), 5 (stock and day-old bread), 6 (customers and orders) and 7 (reports and the oven service).
    Owned by the architect. Developers must not edit this file; open an issue labelled `contract` instead.

    Conventions:
    - IDs are UUID v7 strings.
    - Timestamps are UTC ISO 8601 (`date-time`).
    - Every operation declares `x-permission` (a permission key) or `x-public: true`.
      Operations that need an enrolled till also declare `x-device: required`.
    - Errors always use the `Error` schema with a stable `code`.
    - Money is integer centavos with tax included, in fields ending in `Cents`; rates are basis points (`Bp`).
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://staging.example.invalid
    description: Staging (URL to be set when deployed)
security:
  - bearerAuth: []
tags:
  - name: system
  - name: devices
  - name: auth
  - name: branches
  - name: staff
  - name: audit
  - name: catalog
    description: Categories, products, variants, prices, tax rates and photos (M2)
  - name: sync
    description: Till catalog feed, outbox push and quarantine (M2)
  - name: sales
  - name: shifts
  - name: stock
  - name: orders
  - name: reports
  - name: oven
    description: Sales and refunds made on tills, received through sync (M3)

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness and database connectivity
      security: []
      x-public: true
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Database unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /v1/devices/activate:
    post:
      tags: [devices]
      operationId: activateDevice
      summary: Exchange a one-time enrollment code for a device token
      security: []
      x-public: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceActivateRequest' }
      responses:
        '200':
          description: Device activated. `deviceToken` is returned only here.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceActivateResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '410':
          description: Code already used or expired (`DEVICE_CODE_INVALID`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/devices/me/staff:
    get:
      tags: [devices, staff]
      operationId: getDeviceStaffBundle
      summary: Active staff of the device's branch, with offline PIN verifiers
      security:
        - deviceToken: []
      x-public: true
      x-device: required
      responses:
        '200':
          description: Staff bundle for offline login
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffBundle' }
        '401': { $ref: '#/components/responses/DeviceRejected' }

  /v1/auth/pin-login:
    post:
      tags: [auth]
      operationId: pinLogin
      summary: Staff PIN login on an enrolled device
      security:
        - deviceToken: []
      x-public: true
      x-device: required
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PinLoginRequest' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Wrong PIN (`AUTH_INVALID_PIN`), staff not in this branch or inactive (`AUTH_NOT_ALLOWED`), or device rejected (`DEVICE_UNKNOWN`, `DEVICE_REVOKED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '423': { $ref: '#/components/responses/Locked' }

  /v1/auth/password-login:
    post:
      tags: [auth]
      operationId: passwordLogin
      summary: Back office login with email and password
      security: []
      x-public: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordLoginRequest' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: Wrong credentials (`AUTH_INVALID_CREDENTIALS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '423': { $ref: '#/components/responses/Locked' }

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Rotate a refresh token for a new token pair
      security: []
      x-public: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New tokens; the old refresh token is revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: Refresh token invalid, expired or reused (`AUTH_REFRESH_INVALID`). Reuse of a rotated token revokes the whole session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session
      x-permission: authenticated
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/approvals:
    post:
      tags: [auth]
      operationId: createApproval
      summary: A manager approves a sensitive action with their PIN
      description: |
        Returns a single-use token valid for 2 minutes. The endpoint that performs the action
        receives it in the `X-Approval-Token` header (used from M3 onwards).
        The approver must hold the permission named in `action` and work in the device's branch.
      x-permission: authenticated
      x-device: required
      security:
        - bearerAuth: []
          deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalRequest' }
      responses:
        '201':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Approver lacks the permission (`PERMISSION_DENIED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '423': { $ref: '#/components/responses/Locked' }

  /v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current staff member, branches and permissions
      x-permission: authenticated
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/branches:
    get:
      tags: [branches]
      operationId: listBranches
      summary: List branches
      x-permission: authenticated
      description: Owners see all branches; others see the branches they work in.
      responses:
        '200':
          description: Branches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Branch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [branches]
      operationId: createBranch
      summary: Create a branch
      x-permission: branches.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branch' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/branches/{branchId}:
    parameters:
      - $ref: '#/components/parameters/BranchId'
    patch:
      tags: [branches]
      operationId: updateBranch
      summary: Update a branch
      x-permission: branches.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branch' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/staff:
    get:
      tags: [staff]
      operationId: listStaff
      summary: List staff
      x-permission: staff.manage
      parameters:
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: includeInactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Staff
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Staff' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [staff]
      operationId: createStaff
      summary: Create a staff member
      x-permission: staff.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Staff' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/staff/{staffId}:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    get:
      tags: [staff]
      operationId: getStaff
      summary: Get a staff member
      x-permission: staff.manage
      responses:
        '200':
          description: Staff member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Staff' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [staff]
      operationId: updateStaff
      summary: Update or deactivate a staff member
      x-permission: staff.manage
      description: Setting `isActive` to false revokes all of the staff member's sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Staff' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/staff/{staffId}/pin:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    put:
      tags: [staff]
      operationId: setStaffPin
      summary: Set a staff member's PIN
      x-permission: staff.manage
      description: Sets a new PIN, clears lockout and revokes the staff member's sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PinSet' }
      responses:
        '204': { description: PIN changed }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: List devices
      x-permission: devices.manage
      parameters:
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [devices]
      operationId: createDevice
      summary: Register a device and get an enrollment code
      x-permission: devices.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceCreate' }
      responses:
        '201':
          description: Created in PENDING status; the enrollment code is shown only here
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceEnrollment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/devices/{deviceId}/enrollment-code:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [devices]
      operationId: regenerateEnrollmentCode
      summary: Issue a new enrollment code
      x-permission: devices.manage
      description: Issues a new code for a PENDING device; previous codes stop working.
      responses:
        '201':
          description: New code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceEnrollment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/devices/{deviceId}/revoke:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [devices]
      operationId: revokeDevice
      summary: Revoke a device
      x-permission: devices.manage
      responses:
        '200':
          description: Revoked; its token stops working immediately
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/audit-log:
    get:
      tags: [audit]
      operationId: listAuditLog
      summary: Search the audit log
      x-permission: audit.view
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: staffId
          in: query
          description: Matches actor or approver
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { $ref: '#/components/schemas/AuditAction' }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/shifts:
    get:
      tags: [shifts]
      operationId: listShifts
      summary: Cash shifts for the back office, newest first
      description: |
        Owners (`reports.all`) see every branch. Staff with only `reports.branch` see their own branches;
        asking for another branch returns 403. Shifts are created on tills and arrive through sync.
      x-permission: reports.branch
      parameters:
        - name: from
          in: query
          description: Shifts opened at or after this time
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Shifts opened before this time
          schema: { type: string, format: date-time }
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: deviceId
          in: query
          schema: { type: string, format: uuid }
        - name: flagged
          in: query
          description: Only shifts with a flagged difference
          schema: { type: boolean }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Newest first by openedAt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/shifts/{shiftId}:
    get:
      tags: [shifts]
      operationId: getShift
      summary: A shift with its counts, movements and Z report
      description: A shift of a branch outside the caller's scope reads as 404.
      x-permission: reports.branch
      parameters:
        - name: shiftId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The shift
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/shifts/{shiftId}/notes:
    post:
      tags: [shifts]
      operationId: addShiftNote
      summary: Adds a manager's note to a closed shift
      description: Counts never change; a correction is a note beside them. Writes `cash.note_added`.
      x-permission: reports.branch
      parameters:
        - name: shiftId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              additionalProperties: false
              properties:
                note: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: The shift with the note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/stock/lots:
    get:
      tags: [stock]
      operationId: listBranchLots
      summary: Open lots of the device's branch, for the till's stock view
      description: |
        Lots with units left, plus negative on-hand per variant. The till works out fresh and day-old itself from
        `producedOn`, so ageing at midnight needs no connection (M5 brief 4.3).
      security:
        - deviceToken: []
      x-public: true
      x-device: required
      responses:
        '200':
          description: The branch's stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BranchStock' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/stock/levels:
    get:
      tags: [stock]
      operationId: listStockLevels
      summary: On-hand per variant and branch, for the back office
      x-permission: reports.branch
      parameters:
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: One row per variant and branch with any event
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/StockLevel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/stock/events:
    get:
      tags: [stock]
      operationId: listStockEvents
      summary: The ledger of a variant in a branch, newest first
      x-permission: reports.branch
      parameters:
        - name: branchId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: variantId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockEventPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/stock/waste:
    get:
      tags: [stock]
      operationId: listWaste
      summary: Waste by date, with its cost
      x-permission: reports.branch
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: reason
          in: query
          schema: { $ref: '#/components/schemas/WasteReason' }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WastePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/stock/transfers:
    get:
      tags: [stock]
      operationId: listTransfers
      summary: Transfers from or to the caller's branches, newest first
      x-permission: reports.branch
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TransferStatus' }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [stock]
      operationId: sendTransfer
      summary: Sends stock to another branch, which leaves the sender at once
      x-permission: stock.transfer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferCreate' }
      responses:
        '201':
          description: The transfer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/stock/transfers/{transferId}/receive:
    post:
      tags: [stock]
      operationId: receiveTransfer
      summary: Records what arrived; a difference from what was sent is flagged
      x-permission: stock.transfer
      parameters:
        - name: transferId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferReceive' }
      responses:
        '200':
          description: The received transfer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '400': { $ref: '#/components/responses/ValidationError' }
