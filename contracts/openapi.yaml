              schema: { $ref: '#/components/schemas/OvenFeeRule' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/oven/fees/{ruleId}:
    patch:
      tags: [oven]
      operationId: updateOvenFee
      summary: Changes a dish type's name, fee or order, or turns it off
      x-permission: catalog.manage
      parameters:
        - name: ruleId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OvenFeeRuleUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OvenFeeRule' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/oven/branches/{branchId}:
    put:
      tags: [oven]
      operationId: setOvenBranch
      summary: Turns the oven service on or off for a branch (M8.5)
      x-permission: branches.manage
      parameters:
        - name: branchId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [enabled], additionalProperties: false, properties: { enabled: { type: boolean } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [branchId, enabled], properties: { branchId: { type: string, format: uuid }, enabled: { type: boolean } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/oven/tickets:
    get:
      tags: [oven]
      operationId: listOvenTickets
      summary: Dishes by requested day, for the back office (M9.3)
      x-permission: reports.branch
      parameters:
        - name: from
          in: query
          required: true
          schema: { $ref: '#/components/schemas/LocalDate' }
        - name: to
          in: query
          required: true
          schema: { $ref: '#/components/schemas/LocalDate' }
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OvenTicketList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/tax-rates:
    get:
      tags: [catalog]
      operationId: listTaxRates
      summary: List tax rates
      x-permission: catalog.manage
      parameters:
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Tax rates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaxRate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [catalog]
      operationId: createTaxRate
      summary: Create a tax rate
      x-permission: catalog.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxRateCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxRate' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/tax-rates/{taxRateId}:
    parameters:
      - $ref: '#/components/parameters/TaxRateId'
    patch:
      tags: [catalog]
      operationId: updateTaxRate
      summary: Rename or deactivate a tax rate
      description: The kind and rate of an existing tax rate never change; create a new rate instead. A rate used by an active product cannot be deactivated (`CONFLICT`).
      x-permission: catalog.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxRateUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxRate' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/categories:
    get:
      tags: [catalog]
      operationId: listCategories
      summary: List categories in display order
      x-permission: catalog.manage
      parameters:
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [catalog]
      operationId: createCategory
      summary: Create a category
      x-permission: catalog.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    patch:
      tags: [catalog]
      operationId: updateCategory
      summary: Rename, recolor, reorder or deactivate a category
      x-permission: catalog.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/products:
    get:
      tags: [catalog]
      operationId: listProducts
      summary: Search products with their variants and branch prices
      x-permission: catalog.manage
      parameters:
        - name: q
          in: query
          description: Matches product name, variant name, SKU or barcode (case and accent insensitive)
          schema: { type: string, maxLength: 100 }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IncludeInactive'
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: By category order, then product order, then name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [catalog]
      operationId: createProduct
      summary: Create a product together with its variants
      x-permission: catalog.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [catalog]
      operationId: getProduct
      summary: Get one product with its variants and branch prices
      x-permission: catalog.manage
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [catalog]
      operationId: updateProduct
      summary: Update product fields (variants have their own routes)
      description: Send only changed fields; `null` clears a nullable field.
      x-permission: catalog.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/products/{productId}/variants:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    post:
      tags: [catalog]
      operationId: createVariant
      summary: Add a variant to a product
      x-permission: catalog.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variant' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/variants/{variantId}:
    parameters:
      - $ref: '#/components/parameters/VariantId'
    patch:
      tags: [catalog]
      operationId: updateVariant
      summary: Update a variant, including its base price
      description: Deactivating the last active variant of an active product is refused (`CONFLICT`).
      x-permission: catalog.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variant' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/variants/{variantId}/branch-prices/{branchId}:
    parameters:
      - $ref: '#/components/parameters/VariantId'
      - $ref: '#/components/parameters/BranchId'
    put:
      tags: [catalog]
      operationId: setBranchPrice
      summary: Set the variant's price in one branch
      x-permission: catalog.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchPriceSet' }
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BranchPrice' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [catalog]
      operationId: removeBranchPrice
      summary: Remove the branch override so the base price applies
      x-permission: catalog.manage
      responses:
        '204':
          description: Removed (also when there was no override)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/photos:
    post:
      tags: [catalog]
      operationId: uploadPhoto
      summary: Upload a product photo
      description: JPEG, PNG or WebP up to 5 MB, checked by content. Stored re-encoded as WebP, at most 800 × 800 px, without metadata.
      x-permission: catalog.manage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Photo' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: File over 5 MB (`PAYLOAD_TOO_LARGE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/photos/{photoId}:
    parameters:
      - $ref: '#/components/parameters/PhotoId'
    get:
      tags: [catalog]
      operationId: getPhoto
      summary: Download a product photo
      description: Photo IDs are random and photos are not sensitive, so no token is needed. Sent with `Cache-Control public, max-age=31536000, immutable`.
      security: []
      x-public: true
      responses:
        '200':
          description: WebP image
          content:
            image/webp:
              schema:
                type: string
                format: binary
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/sync/catalog:
    get:
      tags: [sync]
      operationId: pullCatalog
      summary: Catalog rows changed after a sequence number, for the device's branch
      security:
        - deviceToken: []
      x-public: true
      x-device: required
      parameters:
        - name: since
          in: query
          required: true
          description: The `nextSince` of the previous page, or 0 for a full download
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          description: Maximum rows per page, summed over all lists
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200':
          description: Changed rows ordered by change sequence; inactive and removed rows are included so the till can hide them
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogChanges' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/DeviceRejected' }

  /v1/sync/push:
    post:
      tags: [sync]
      operationId: pushRecords
      summary: Deliver records from the till's outbox
      description: |
        Each record is applied in its own transaction, so one bad record never blocks the others.
        Records are idempotent by `id`: sending one again returns `DUPLICATE` (or `QUARANTINED` if it was quarantined).
        Rate-limited to 60 requests a minute per device.
      security:
        - deviceToken: []
      x-public: true
      x-device: required
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncPushRequest' }
      responses:
        '200':
          description: One result per record, in request order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPushResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/DeviceRejected' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/sync/quarantine:
    get:
      tags: [sync]
      operationId: listQuarantine
      summary: Records the server could not apply
      x-permission: settings.manage
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, RESOLVED, ALL], default: OPEN }
        - name: deviceId
          in: query
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuarantinePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/sync/quarantine/{recordId}/resolve:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    post:
      tags: [sync]
      operationId: resolveQuarantine
      summary: Mark a quarantined record as resolved (it is not re-applied)
      x-permission: settings.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuarantineResolve' }
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuarantineEntry' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/sales:
    get:
      tags: [sales]
      operationId: listSales
      summary: Sales for the back office, newest first
      description: |
        Owners (`reports.all`) see every branch. Staff with only `reports.branch` see their own branches;
        asking for another branch returns 403.
      x-permission: reports.branch
      parameters:
        - name: from
          in: query
          description: Sales that occurred at or after this time
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Sales that occurred before this time
          schema: { type: string, format: date-time }
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: deviceId
          in: query
          schema: { type: string, format: uuid }
        - name: folio
          in: query
          description: Exact folio, for example `SUC1-02-000153`
          schema: { type: string, maxLength: 30 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Newest first by occurredAt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/sales/lookup:
    get:
      tags: [sales]
      operationId: lookupSale
      summary: Find a sale of this till's branch by folio, to refund or void it
      x-permission: sale.create
      x-device: required
      security:
        - bearerAuth: []
          deviceToken: []
      parameters:
        - name: folio
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 30 }
      responses:
        '200':
          description: The sale with its refunds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sale' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/sales/{saleId}:
    parameters:
      - $ref: '#/components/parameters/SaleId'
    get:
      tags: [sales]
      operationId: getSale
      summary: One sale with its lines, discounts, payments and refunds
      x-permission: reports.branch
      responses:
        '200':
          description: The sale
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sale' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token, 15 minutes. Claims - sub (staff id), sid (session id), did (device id or absent), branchIds.
    deviceToken:
      type: apiKey
      in: header
      name: X-Device-Token
      description: Opaque device token from activateDevice.

  parameters:
    BranchId:
      name: branchId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StaffId:
      name: staffId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, format: uuid }

    TaxRateId:
      name: taxRateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VariantId:
      name: variantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PhotoId:
      name: photoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RecordId:
      name: recordId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SaleId:
      name: saleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IncludeInactive:
      name: includeInactive
      in: query
      schema: { type: boolean, default: false }

  responses:
    ValidationError:
      description: Request body or parameters invalid (`VALIDATION_FAILED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid access token (`AUTH_REQUIRED`, `AUTH_TOKEN_EXPIRED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but lacking the permission (`PERMISSION_DENIED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found (`NOT_FOUND`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Unique value already used or state does not allow it (`CONFLICT`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Locked:
      description: Too many failed attempts (`AUTH_LOCKED`); `details.lockedUntil` says when to retry
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests (`RATE_LIMITED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DeviceRejected:
      description: Device token missing, unknown or revoked (`DEVICE_UNKNOWN`, `DEVICE_REVOKED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [AUTH_INVALID_PIN]
        message:
          type: string
          description: English, for logs. The app maps `code` to Spanish text.
        details:
          type: object
          additionalProperties: true

    Health:
      type: object
      required: [status, database, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, unreachable] }
        version: { type: string }

    Role:
      type: string
      enum: [OWNER, BRANCH_MANAGER, CASHIER, BAKER]

    PermissionKey:
      type: string
      enum:
        - sale.create
        - sale.void_line_before_payment
        - sale.void_after_payment
        - sale.refund
        - sale.discount_within_limit
        - sale.discount_over_limit
        - cash.open_shift
        - cash.close_shift
        - cash.movement
        - cash.open_drawer_no_sale
        - stock.production_entry
        - stock.waste
        - stock.count_adjust
        - stock.transfer
        - orders.manage
        - orders.pickup
        - oven.intake_pickup
        - oven.board
        - catalog.manage
        - catalog.cost
        - staff.manage
        - devices.manage
        - branches.manage
        - reports.branch
        - reports.all
        - audit.view
        - settings.manage

    Pin:
      type: string
      pattern: '^[0-9]{4,6}$'
      description: Never logged, never returned.

    Branch:
      type: object
      required: [id, code, name, timezone, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z0-9]{2,10}$', examples: [SUC1] }
        name: { type: string, maxLength: 120 }
        address: { type: [string, 'null'], maxLength: 300 }
        timezone: { type: string, default: America/Mexico_City }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BranchCreate:
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[A-Z0-9]{2,10}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        address: { type: string, maxLength: 300 }
        timezone: { type: string, default: America/Mexico_City }
    BranchUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        address: { type: [string, 'null'], maxLength: 300 }
        timezone: { type: string }
        isActive: { type: boolean }

    Staff:
      type: object
      required: [id, fullName, displayName, role, branchIds, isActive, hasPassword, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        displayName: { type: string, description: Short name on tiles and receipts }
        role: { $ref: '#/components/schemas/Role' }
        email: { type: [string, 'null'], format: email }
        branchIds:
          type: array
          items: { type: string, format: uuid }
        isActive: { type: boolean }
        hasPassword: { type: boolean }
        lockedUntil: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StaffCreate:
      type: object
      required: [fullName, displayName, role, branchIds, pin]
      additionalProperties: false
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        displayName: { type: string, minLength: 1, maxLength: 30 }
        role: { $ref: '#/components/schemas/Role' }
        email: { type: string, format: email }
        password:
          type: string
          minLength: 10
          description: Required when role is OWNER; optional for BRANCH_MANAGER.
        branchIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        pin: { $ref: '#/components/schemas/Pin' }
    StaffUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        displayName: { type: string, minLength: 1, maxLength: 30 }
        role: { $ref: '#/components/schemas/Role' }
        email: { type: [string, 'null'], format: email }
        password: { type: string, minLength: 10 }
        branchIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        isActive: { type: boolean }
    PinSet:
      type: object
      required: [pin]
      additionalProperties: false
      properties:
        pin: { $ref: '#/components/schemas/Pin' }

    StaffBundle:
      type: object
      required: [branchId, generatedAt, staff, roles]
      description: |
        `folioPrefix` and `saleSettings` are sent by every server from 0.3.0-m3. They are optional in the schema only so
        a till can tell an older server apart; a till without `folioPrefix` must not sell.
      properties:
        branchId: { type: string, format: uuid }
        generatedAt: { type: string, format: date-time }
        folioPrefix:
          type: [string, 'null']
          description: This device's folio prefix (`Device.folioPrefix`); null for production stations.
          examples: [SUC1-02]
        saleSettings: { $ref: '#/components/schemas/SaleSettings' }
        staff:
          type: array
          items: { $ref: '#/components/schemas/StaffBundleEntry' }
        roles:
          type: object
          description: Permission keys per role, so the till can check permissions offline.
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/PermissionKey' }
    StaffBundleEntry:
      type: object
      required: [id, displayName, role, offlinePinVerifier, pinUpdatedAt]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        offlinePinVerifier:
          type: string
          description: |
            Argon2id encoded hash (PHC string format, m=65536, t=3, p=1) of the PIN with its own random salt,
            computed when the PIN is set. It is NOT the server's `pin_hash`. Stored only in the till's
            encrypted storage.
          examples: ['$argon2id$v=19$m=65536,t=3,p=1$c2FsdHNhbHQ$aGFzaGhhc2hoYXNo']
        pinUpdatedAt: { type: string, format: date-time }

    DeviceType:
      type: string
      enum: [TILL, PRODUCTION]
    DeviceStatus:
      type: string
      enum: [PENDING, ACTIVE, REVOKED]
    Device:
      type: object
      required: [id, branchId, name, type, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        name: { type: string, examples: [Caja 1] }
        type: { $ref: '#/components/schemas/DeviceType' }
        status: { $ref: '#/components/schemas/DeviceStatus' }
        lastSeenAt: { type: [string, 'null'], format: date-time }
        appVersion: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        tillNumber:
          type: [integer, 'null']
          minimum: 1
          maximum: 99
          description: Set by the server for TILL devices (1 + the highest number used in the branch, never reused); null for PRODUCTION.
        folioPrefix:
          type: [string, 'null']
          description: '`<branch code>-<till number, 2 digits>`; null for PRODUCTION.'
          examples: [SUC1-02]
    DeviceCreate:
      type: object
      required: [branchId, name, type]
      additionalProperties: false
      properties:
        branchId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 40 }
        type: { $ref: '#/components/schemas/DeviceType' }
    DeviceEnrollment:
      type: object
      required: [device, enrollmentCode, expiresAt]
      properties:
        device: { $ref: '#/components/schemas/Device' }
        enrollmentCode:
          type: string
          pattern: '^[A-HJ-NP-Z2-9]{8}$'
          description: Shown once. Valid 30 minutes, single use.
        expiresAt: { type: string, format: date-time }
    DeviceActivateRequest:
      type: object
      required: [enrollmentCode, appVersion]
      additionalProperties: false
      properties:
        enrollmentCode: { type: string, pattern: '^[A-HJ-NP-Z2-9]{8}$' }
        appVersion: { type: string, maxLength: 40 }
    DeviceActivateResponse:
      type: object
      required: [device, deviceToken, branch]
      properties:
        device: { $ref: '#/components/schemas/Device' }
        deviceToken:
          type: string
          description: Shown once. Store in secure storage; send as X-Device-Token.
        branch: { $ref: '#/components/schemas/Branch' }

    PinLoginRequest:
      type: object
      required: [staffId, pin]
      additionalProperties: false
      properties:
        staffId: { type: string, format: uuid }
        pin: { $ref: '#/components/schemas/Pin' }
    PasswordLoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 200 }
    RefreshRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties:
        refreshToken: { type: string }
    TokenPair:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: Till sessions end at 04:00 branch local time the next day; back office sessions after 12 hours.
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [me]
          properties:
            me: { $ref: '#/components/schemas/Me' }
    Me:
      type: object
      required: [staff, permissions]
      properties:
        staff: { $ref: '#/components/schemas/Staff' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/PermissionKey' }
        deviceId: { type: [string, 'null'], format: uuid }

    ApprovalRequest:
      type: object
      required: [approverStaffId, pin, action]
      additionalProperties: false
      properties:
        approverStaffId: { type: string, format: uuid }
        pin: { $ref: '#/components/schemas/Pin' }
        action:
          $ref: '#/components/schemas/PermissionKey'
        reference:
          type: string
          maxLength: 100
          description: What is being approved, for example a sale folio.
    ApprovalResponse:
      type: object
      required: [approvalToken, expiresAt, approverStaffId, action]
      properties:
        approvalToken: { type: string }
        expiresAt: { type: string, format: date-time }
        approverStaffId: { type: string, format: uuid }
        action: { $ref: '#/components/schemas/PermissionKey' }

    AuditAction:
      type: string
      enum:
        - auth.login_success
        - auth.login_failure
        - auth.locked
        - auth.logout
        - auth.approval_granted
        - auth.approval_denied
        - staff.created
        - staff.updated
        - staff.deactivated
        - staff.pin_changed
        - device.created
        - device.activated
        - device.revoked
        - branch.created
        - branch.updated
        - catalog.category_created
        - catalog.category_updated
        - catalog.product_created
        - catalog.product_updated
        - catalog.variant_created
        - catalog.variant_updated
        - catalog.price_changed
        - catalog.branch_price_changed
        - catalog.tax_rate_created
        - catalog.tax_rate_updated
        - sync.quarantine_resolved
        - sale.discount_over_limit
        - sale.refunded
        - sale.voided
        - sale.ticket_discarded
        - cash.shift_opened
        - cash.movement
        - cash.shift_closed
        - cash.variance_flagged
        - cash.drawer_opened
        - cash.note_added
        - catalog.cost_changed
        - stock.production_entered
        - stock.waste_recorded
        - stock.transfer_sent
        - stock.transfer_received
        - stock.transfer_mismatch
        - stock.count_adjusted
        - stock.ledger_mismatch
        - customer.created
        - customer.updated
        - order.created
        - order.updated
        - order.paused
        - order.skipped
        - order.prepaid
        - order.picked_up
        - order.missed
        - oven.fee_changed
        - oven.branch_changed
        - oven.received
        - oven.picked_up
    AuditEntry:
      type: object
      required: [id, occurredAt, action]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        branchId: { type: [string, 'null'], format: uuid }
        deviceId: { type: [string, 'null'], format: uuid }
        actorStaffId: { type: [string, 'null'], format: uuid }
        approverStaffId: { type: [string, 'null'], format: uuid }
        action: { $ref: '#/components/schemas/AuditAction' }
        entityType: { type: [string, 'null'] }
        entityId: { type: [string, 'null'] }
        data:
          type: object
          additionalProperties: true
          description: Never contains PINs, passwords or tokens.
    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        nextCursor: { type: [string, 'null'] }

    Cents:
      type: integer
      minimum: 1
      maximum: 10000000
      description: Integer centavos, tax included (`1250` = $12.50)
    BasisPoints:
      type: integer
      minimum: 0
      maximum: 10000
      description: Hundredths of a percent (`1600` = 16%)
    TaxKind:
      type: string
      enum: [IVA, IEPS]
    TaxRate:
      type: object
      required: [id, kind, name, rateBp, isActive, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/TaxKind' }
        name: { type: string, examples: ['IVA 16%'] }
        rateBp: { $ref: '#/components/schemas/BasisPoints' }
        isActive: { type: boolean }
        updatedAt: { type: string, format: date-time }
    TaxRateCreate:
      type: object
      required: [kind, name, rateBp]
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/TaxKind' }
        name: { type: string, minLength: 1, maxLength: 60 }
        rateBp: { $ref: '#/components/schemas/BasisPoints' }
    TaxRateUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        isActive: { type: boolean }

    Category:
      type: object
      required: [id, name, sortOrder, color, isActive, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sortOrder: { type: integer }
        color: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }
        isActive: { type: boolean }
        updatedAt: { type: string, format: date-time }
    CategoryCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        color: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
    CategoryUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        color: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
        isActive: { type: boolean }

    ProductUnit:
      type: string
      enum: [PIECE, KG, PACKAGE]
    DayOldDays:
      type: [integer, 'null']
      minimum: 1
      maximum: 60
    Product:
      type: object
      description: Back office view, with variants and their branch prices.
      required: [id, categoryId, name, description, unit, photoId, ivaRateId, iepsRateId, dayOldDiscountAfterDays, dayOldDiscountBp, dayOldWasteAfterDays, sortOrder, isActive, updatedAt, variants]
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        unit: { $ref: '#/components/schemas/ProductUnit' }
        photoId: { type: [string, 'null'], format: uuid }
        ivaRateId: { type: string, format: uuid }
        iepsRateId: { type: [string, 'null'], format: uuid }
        dayOldDiscountAfterDays: { $ref: '#/components/schemas/DayOldDays' }
        dayOldDiscountBp: { type: [integer, 'null'], minimum: 1, maximum: 10000 }
        dayOldWasteAfterDays: { $ref: '#/components/schemas/DayOldDays' }
        sortOrder: { type: integer }
        isActive: { type: boolean }
        updatedAt: { type: string, format: date-time }
        variants:
          type: array
          items: { $ref: '#/components/schemas/Variant' }
    ProductCreate:
      type: object
      required: [categoryId, name, unit, ivaRateId, variants]
      additionalProperties: false
      description: Day-old discount days and percentage are both set or both null; waste days must be greater than discount days when both are set.
      properties:
        categoryId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 500 }
        unit: { $ref: '#/components/schemas/ProductUnit' }
        photoId: { type: [string, 'null'], format: uuid }
        ivaRateId: { type: string, format: uuid }
        iepsRateId: { type: [string, 'null'], format: uuid }
        dayOldDiscountAfterDays: { $ref: '#/components/schemas/DayOldDays' }
        dayOldDiscountBp: { type: [integer, 'null'], minimum: 1, maximum: 10000 }
        dayOldWasteAfterDays: { $ref: '#/components/schemas/DayOldDays' }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
        variants:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: '#/components/schemas/VariantCreate' }
    ProductUpdate:
      type: object
      additionalProperties: false
      properties:
        categoryId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 500 }
        unit: { $ref: '#/components/schemas/ProductUnit' }
        photoId: { type: [string, 'null'], format: uuid }
        ivaRateId: { type: string, format: uuid }
        iepsRateId: { type: [string, 'null'], format: uuid }
        dayOldDiscountAfterDays: { $ref: '#/components/schemas/DayOldDays' }
        dayOldDiscountBp: { type: [integer, 'null'], minimum: 1, maximum: 10000 }
        dayOldWasteAfterDays: { $ref: '#/components/schemas/DayOldDays' }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
        isActive: { type: boolean }
    ProductPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        nextCursor: { type: [string, 'null'] }

    Variant:
      type: object
      required: [id, productId, name, sku, barcode, priceCents, sortOrder, isActive, updatedAt, branchPrices]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        name: { type: string }
        sku: { type: [string, 'null'] }
        barcode: { type: [string, 'null'] }
        priceCents: { $ref: '#/components/schemas/Cents' }
        costCents:
          oneOf:
            - { $ref: '#/components/schemas/Cents' }
            - { type: 'null' }
        unitsPerTray: { type: [integer, 'null'], minimum: 1, maximum: 1000 }
        sortOrder: { type: integer }
        isActive: { type: boolean }
        updatedAt: { type: string, format: date-time }
        branchPrices:
          type: array
          items: { $ref: '#/components/schemas/BranchPrice' }
    VariantCreate:
      type: object
      required: [name, priceCents]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        sku: { type: [string, 'null'], minLength: 1, maxLength: 40 }
        barcode: { type: [string, 'null'], pattern: '^[0-9A-Za-z-]{4,32}$' }
        priceCents: { $ref: '#/components/schemas/Cents' }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
    VariantUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        sku: { type: [string, 'null'], minLength: 1, maxLength: 40 }
        barcode: { type: [string, 'null'], pattern: '^[0-9A-Za-z-]{4,32}$' }
        priceCents: { $ref: '#/components/schemas/Cents' }
        costCents:
          oneOf:
            - { $ref: '#/components/schemas/Cents' }
            - { type: 'null' }
        unitsPerTray: { type: [integer, 'null'], minimum: 1, maximum: 1000 }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
        isActive: { type: boolean }
    BranchPrice:
      type: object
      required: [variantId, branchId, priceCents, updatedAt]
      properties:
        variantId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        priceCents: { $ref: '#/components/schemas/Cents' }
        updatedAt: { type: string, format: date-time }
    BranchPriceSet:
      type: object
      required: [priceCents]
      additionalProperties: false
      properties:
        priceCents: { $ref: '#/components/schemas/Cents' }

    Photo:
      type: object
      required: [id, width, height, bytes]
      properties:
        id: { type: string, format: uuid }
        width: { type: integer }
        height: { type: integer }
        bytes: { type: integer }

    CatalogChanges:
      type: object
      description: |
        Flat rows for the till. Apply a page in one local transaction, then store `nextSince`.
        Keep asking while `hasMore` is true. Inactive rows are sent so the till can hide them;
        a removed branch price comes with `removed: true` and `priceCents: null`.
      required: [nextSince, hasMore, serverTime, taxRates, categories, products, variants, branchPrices]
      properties:
        nextSince: { type: integer, format: int64 }
        hasMore: { type: boolean }
        serverTime: { type: string, format: date-time }
        taxRates:
          type: array
          items: { $ref: '#/components/schemas/TaxRate' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        products:
          type: array
          items: { $ref: '#/components/schemas/CatalogProduct' }
        variants:
          type: array
          items: { $ref: '#/components/schemas/CatalogVariant' }
        branchPrices:
          type: array
          description: Only the device's branch
          items: { $ref: '#/components/schemas/CatalogBranchPrice' }
    CatalogProduct:
      type: object
      required: [id, categoryId, name, unit, photoId, ivaRateId, iepsRateId, dayOldDiscountAfterDays, dayOldDiscountBp, dayOldWasteAfterDays, sortOrder, isActive]
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        name: { type: string }
        unit: { $ref: '#/components/schemas/ProductUnit' }
        photoId: { type: [string, 'null'], format: uuid }
        ivaRateId: { type: string, format: uuid }
        iepsRateId: { type: [string, 'null'], format: uuid }
        dayOldDiscountAfterDays: { $ref: '#/components/schemas/DayOldDays' }
        dayOldDiscountBp: { type: [integer, 'null'], minimum: 1, maximum: 10000 }
        dayOldWasteAfterDays: { $ref: '#/components/schemas/DayOldDays' }
        sortOrder: { type: integer }
        isActive: { type: boolean }
    CatalogVariant:
      type: object
      required: [id, productId, name, sku, barcode, priceCents, unitsPerTray, sortOrder, isActive]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        name: { type: string }
        sku: { type: [string, 'null'] }
        barcode: { type: [string, 'null'] }
        priceCents: { $ref: '#/components/schemas/Cents' }
        unitsPerTray: { type: [integer, 'null'], description: 'Production entry works in trays when set' }
        sortOrder: { type: integer }
        isActive: { type: boolean }
    CatalogBranchPrice:
      type: object
      required: [variantId, priceCents, removed]
      properties:
        variantId: { type: string, format: uuid }
        priceCents:
          type: [integer, 'null']
          minimum: 1
        removed: { type: boolean }

    SyncRecordType:
      type: string
      description: |
        Known types: `audit.offline_event` (payload `OfflineAuditPayload`), `sale.completed`
        (payload `SaleCompletedPayload`, record `id` = sale ID) and `sale.refunded` (payload
        `SaleRefundedPayload`, record `id` = refund ID), `shift.opened` (payload `ShiftOpenedPayload`, record `id` = shift ID),
        `cash.movement` (payload `CashMovementPayload`), `shift.closed` (payload `ShiftClosedPayload`), `stock.produced`
        (payload `StockProducedPayload`, record `id` = lot ID), `stock.wasted` (payload `StockWastedPayload`) and `stock.counted`
        (payload `StockCountedPayload`) and `order.prepaid`
        (payload `OrderPrepaidPayload`, record `id` = prepaid entry ID), `oven.received`
        (payload `OvenReceivedPayload`, record `id` = oven ticket ID), `oven.status` (payload `OvenStatusPayload`) and
        `oven.picked_up` (payload `OvenPickedUpPayload`). The server accepts any string and quarantines
        unknown types with `SYNC_UNKNOWN_TYPE`, so an older server never rejects a whole batch.
      examples: [audit.offline_event, sale.completed, sale.refunded, shift.opened, cash.movement, shift.closed, stock.produced, stock.wasted, stock.counted, order.prepaid, oven.received, oven.status, oven.picked_up]
    SyncRecord:
      type: object
      required: [id, type, occurredAt, payload]
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7 created on the till when the record was written; the idempotency key.
        type: { $ref: '#/components/schemas/SyncRecordType' }
        occurredAt: { type: string, format: date-time }
        actorStaffId: { type: [string, 'null'], format: uuid }
        payload:
          type: object
          additionalProperties: true
    OfflineAuditPayload:
      type: object
      description: Payload of `audit.offline_event`. Never contains a PIN.
      required: [action, staffId]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [auth.login_success, auth.login_failure, auth.locked, auth.approval_granted, sale.ticket_discarded, cash.drawer_opened]
        staffId:
          type: string
          format: uuid
          description: Who logged in, who failed, who was locked, or who asked for the approval
        approverStaffId:
          type: [string, 'null']
          format: uuid
          description: Required for `auth.approval_granted`
        approvalAction:
          type: [string, 'null']
          description: The permission key (`PermissionKey`) that was approved; required for `auth.approval_granted`
        reference: { type: [string, 'null'], maxLength: 100 }
        ticket:
          type: [object, 'null']
          description: Required for `sale.ticket_discarded` - what was on the ticket that was never paid.
          required: [lineCount, amountCents]
          additionalProperties: false
          properties:
            lineCount: { type: integer, minimum: 1, maximum: 500 }
            amountCents: { type: integer, minimum: 0, maximum: 100000000 }
    SyncPushRequest:
      type: object
      required: [records]
      additionalProperties: false
      properties:
        records:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/SyncRecord' }
    SyncResultStatus:
      type: string
      enum: [APPLIED, DUPLICATE, QUARANTINED]
    SyncPushResult:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/SyncResultStatus' }
        errorCode:
          type: [string, 'null']
          description: Set when QUARANTINED - `SYNC_UNKNOWN_TYPE`, `SYNC_INVALID_PAYLOAD` or `SYNC_REJECTED`
        message: { type: [string, 'null'] }
    SyncPushResponse:
      type: object
      required: [results, serverTime]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/SyncPushResult' }
        serverTime: { type: string, format: date-time }

    QuarantineEntry:
      type: object
      required: [recordId, deviceId, branchId, type, occurredAt, receivedAt, errorCode, errorMessage, payload, resolvedAt, resolvedByStaffId, resolutionNote]
      properties:
        recordId: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        type: { type: string }
        occurredAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        errorCode: { type: string }
        errorMessage: { type: string }
        payload:
          type: object
          additionalProperties: true
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolvedByStaffId: { type: [string, 'null'], format: uuid }
        resolutionNote: { type: [string, 'null'] }
    QuarantinePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/QuarantineEntry' }
        nextCursor: { type: [string, 'null'] }
    QuarantineResolve:
      type: object
      required: [note]
      additionalProperties: false
      properties:
        note: { type: string, minLength: 1, maxLength: 500 }

    SaleSettings:
      type: object
      required: [discountLimitBp, cashVarianceFlagCents]
      properties:
        discountLimitBp:
          allOf: [{ $ref: '#/components/schemas/BasisPoints' }]
          description: Largest discount share a cashier may give without a manager (`1000` = 10%). M3 brief 4.2 step 7.
        cashVarianceFlagCents:
          allOf: [{ $ref: '#/components/schemas/AnyCents' }]
          description: A close whose difference passes this amount, in either direction, is flagged (`5000` = $50.00). M4 brief section 2.
    AnyCents:
      type: integer
      minimum: 0
      maximum: 100000000
      description: Integer centavos that may be zero (totals, discounts, change)
    Folio:
      type: string
      pattern: '^[A-Z0-9]{1,10}-[0-9]{2}-[0-9]{6}$'
      examples: [SUC1-02-000153]
    DiscountKind:
      type: string
      enum: [PERCENT, AMOUNT]
    DiscountReason:
      type: string
      enum: [FREQUENT_CUSTOMER, DAMAGED, PROMOTION, OTHER]
    DiscountInput:
      type: object
      required: [kind, value, reason]
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/DiscountKind' }
        value:
          type: integer
          minimum: 1
          maximum: 100000000
          description: Basis points for PERCENT (at most 10000), centavos for AMOUNT
        reason: { $ref: '#/components/schemas/DiscountReason' }
        note: { type: [string, 'null'], maxLength: 120 }
        approverStaffId:
          type: [string, 'null']
          format: uuid
          description: Required when the discount's share is above `discountLimitBp`; must hold `sale.discount_over_limit`
    PaymentMethod:
      type: string
      description: '`PREPAID` is a pickup paid from the customer''s balance; tendered and change are 0 (M6 brief 2).'
      enum: [CASH, PREPAID]
    SaleLineInput:
      type: object
      required: [lineNo, variantId, productName, variantName, quantity, unitPriceCents, dayOld, fullPriceCents, ivaRateId, ivaBp, iepsBp, grossCents, lineDiscountCents, orderDiscountCents, netCents, baseCents, iepsCents, ivaCents]
      additionalProperties: false
      properties:
        lineNo: { type: integer, minimum: 1, maximum: 500 }
        variantId: { type: string, format: uuid }
        productName: { type: string, minLength: 1, maxLength: 120 }
        variantName: { type: string, minLength: 1, maxLength: 120 }
        quantity: { type: integer, minimum: 1, maximum: 9999 }
        unitPriceCents: { $ref: '#/components/schemas/Cents' }
        dayOld: { type: boolean, description: 'Sold from aged stock at the day-old price (M6.2)' }
        fullPriceCents:
          allOf: [{ $ref: '#/components/schemas/Cents' }]
          description: The price without the day-old reduction; equals `unitPriceCents` when not `dayOld`
        ivaRateId: { type: string, format: uuid }
        ivaBp: { $ref: '#/components/schemas/BasisPoints' }
        iepsRateId: { type: [string, 'null'], format: uuid }
        iepsBp: { $ref: '#/components/schemas/BasisPoints' }
        discount:
          oneOf:
            - { $ref: '#/components/schemas/DiscountInput' }
            - { type: 'null' }
        grossCents: { $ref: '#/components/schemas/AnyCents' }
        lineDiscountCents: { $ref: '#/components/schemas/AnyCents' }
        orderDiscountCents: { $ref: '#/components/schemas/AnyCents' }
        netCents: { $ref: '#/components/schemas/AnyCents' }
        baseCents: { $ref: '#/components/schemas/AnyCents' }
        iepsCents: { $ref: '#/components/schemas/AnyCents' }
        ivaCents: { $ref: '#/components/schemas/AnyCents' }
    VoidedLineInput:
      type: object
      required: [variantId, quantity, unitPriceCents, voidedAt, staffId]
      additionalProperties: false
      properties:
        variantId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 9999 }
        unitPriceCents: { $ref: '#/components/schemas/Cents' }
        voidedAt: { type: string, format: date-time }
        staffId: { type: string, format: uuid }
    PaymentInput:
      type: object
      required: [method, amountCents, tenderedCents, changeCents]
      additionalProperties: false
      properties:
        method: { $ref: '#/components/schemas/PaymentMethod' }
        amountCents: { $ref: '#/components/schemas/AnyCents' }
        tenderedCents: { $ref: '#/components/schemas/AnyCents' }
        changeCents: { $ref: '#/components/schemas/AnyCents' }
    SaleCompletedPayload:
      type: object
      description: |
        Payload of `sale.completed`. The record `id` is the sale ID. Every amount must match the totals in M3 brief
        section 4.2, recomputed by the server. Exactly one CASH payment in M3.
      required: [folio, folioNumber, cashierStaffId, shiftId, lines, voidedLines, grossCents, discountCents, totalCents, payments]
      additionalProperties: false
      properties:
        folio: { $ref: '#/components/schemas/Folio' }
        folioNumber: { type: integer, minimum: 1, maximum: 999999 }
        cashierStaffId: { type: string, format: uuid }
        shiftId: { type: string, format: uuid, description: 'The open shift of this device (M4.1)' }
        orderTicketId:
          type: [string, 'null']
          format: uuid
          description: The order ticket a `PREPAID` sale hands over; null for any other sale (M6 brief 4.4)
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/SaleLineInput' }
        orderDiscount:
          oneOf:
            - { $ref: '#/components/schemas/DiscountInput' }
            - { type: 'null' }
        voidedLines:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/VoidedLineInput' }
        grossCents: { $ref: '#/components/schemas/AnyCents' }
        discountCents: { $ref: '#/components/schemas/AnyCents' }
        totalCents: { $ref: '#/components/schemas/AnyCents' }
        payments:
          type: array
          minItems: 1
          maxItems: 1
          items: { $ref: '#/components/schemas/PaymentInput' }
    RefundKind:
      type: string
      enum: [REFUND, VOID]
    RefundReason:
      type: string
      enum: [CUSTOMER_RETURN, WRONG_ITEM, QUALITY, CASHIER_ERROR, OTHER]
    RefundLineInput:
      type: object
      required: [lineNo, quantity, amountCents, baseCents, iepsCents, ivaCents, restock]
      additionalProperties: false
      properties:
        lineNo: { type: integer, minimum: 1, maximum: 500 }
        quantity: { type: integer, minimum: 1, maximum: 9999 }
        amountCents: { $ref: '#/components/schemas/AnyCents' }
        baseCents: { $ref: '#/components/schemas/AnyCents' }
        iepsCents: { $ref: '#/components/schemas/AnyCents' }
        ivaCents: { $ref: '#/components/schemas/AnyCents' }
        restock: { type: boolean, description: 'The units go back to stock (used from Sprint 5)' }
    SaleRefundedPayload:
      type: object
      description: |
        Payload of `sale.refunded`. The record `id` is the refund ID. Amounts follow M3 brief section 4.3.
        A VOID covers every remaining unit of a sale made on the same device on the same local day.
      required: [saleId, shiftId, kind, reason, staffId, lines, totalCents]
      additionalProperties: false
      properties:
        saleId: { type: string, format: uuid }
        shiftId: { type: string, format: uuid, description: 'The open shift of the device paying the money, which may differ from the sale''s (M4 brief section 2)' }
        kind: { $ref: '#/components/schemas/RefundKind' }
        reason: { $ref: '#/components/schemas/RefundReason' }
        note: { type: [string, 'null'], maxLength: 120 }
        staffId: { type: string, format: uuid }
        approverStaffId:
          type: [string, 'null']
          format: uuid
          description: Required when `staffId` lacks the permission (`sale.refund` or `sale.void_after_payment`); the approver must hold it
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/RefundLineInput' }
        totalCents: { $ref: '#/components/schemas/AnyCents' }
    Denomination:
      type: integer
      description: Value of a bill or coin in centavos. Bills and coins of the same value share a row.
      enum: [100000, 50000, 20000, 10000, 5000, 2000, 1000, 500, 200, 100, 50]
    CashCountRow:
      type: object
      required: [denominationCents, quantity]
      additionalProperties: false
      properties:
        denominationCents: { $ref: '#/components/schemas/Denomination' }
        quantity: { type: integer, minimum: 0, maximum: 100000 }
    CashCount:
      type: array
      description: One row per denomination at most. The sum of value times quantity must equal the stated amount.
      minItems: 1
      maxItems: 11
      items: { $ref: '#/components/schemas/CashCountRow' }
    ShiftOpenedPayload:
      type: object
      description: Payload of `shift.opened`. The record `id` is the shift ID. M4 brief section 4.1.
      required: [staffId, floatCents, count]
      additionalProperties: false
      properties:
        staffId: { type: string, format: uuid }
        floatCents: { $ref: '#/components/schemas/AnyCents' }
        count: { $ref: '#/components/schemas/CashCount' }
    CashMovementKind:
      type: string
      enum: [IN, OUT]
    CashMovementReason:
      type: string
      enum: [CHANGE_FUND, SUPPLIER_PAYMENT, BANK_DROP, OTHER]
    CashMovementPayload:
      type: object
      description: Payload of `cash.movement`. The record `id` is the movement ID. A note is required with `OTHER`.
      required: [shiftId, kind, amountCents, reason, staffId]
      additionalProperties: false
      properties:
        shiftId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/CashMovementKind' }
        amountCents:
          allOf: [{ $ref: '#/components/schemas/AnyCents' }]
          minimum: 1
        reason: { $ref: '#/components/schemas/CashMovementReason' }
        note: { type: [string, 'null'], maxLength: 120 }
        staffId: { type: string, format: uuid }
        approverStaffId:
          type: [string, 'null']
          format: uuid
          description: Required when `staffId` lacks `cash.movement`; the approver must hold it
    ShiftClosedPayload:
      type: object
      description: |
        Payload of `shift.closed`. The record `id` is a new ID; `shiftId` names the shift. The server recomputes
        expected, variance and the flag with M4 brief section 4.3 and rejects any difference. A note is required
        when flagged.
      required: [shiftId, zNumber, staffId, count, countedCents, expectedCents, varianceCents, flagged]
      additionalProperties: false
      properties:
        shiftId: { type: string, format: uuid }
        zNumber: { type: integer, minimum: 1, maximum: 9999 }
        staffId: { type: string, format: uuid }
        count: { $ref: '#/components/schemas/CashCount' }
        countedCents: { $ref: '#/components/schemas/AnyCents' }
        expectedCents: { type: integer, description: 'Can be negative when more cash left than came in' }
        varianceCents: { type: integer, description: 'counted minus expected' }
        flagged: { type: boolean }
        note: { type: [string, 'null'], maxLength: 500 }
    ShiftStatus:
      type: string
      enum: [OPEN, CLOSED]
    ShiftSummary:
      type: object
      required: [id, branchId, deviceId, status, openedAt, openedByStaffId, openedByName, floatCents, flagged]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ShiftStatus' }
        zNumber: { type: [integer, 'null'] }
        zLabel: { type: [string, 'null'], examples: [SUC1-02-Z0012] }
        openedAt: { type: string, format: date-time }
        openedByStaffId: { type: string, format: uuid }
        openedByName: { type: string }
        closedAt: { type: [string, 'null'], format: date-time }
        closedByStaffId: { type: [string, 'null'], format: uuid }
        closedByName: { type: [string, 'null'] }
        floatCents: { $ref: '#/components/schemas/AnyCents' }
        expectedCents: { type: [integer, 'null'] }
        countedCents: { type: [integer, 'null'] }
        varianceCents: { type: [integer, 'null'] }
        flagged: { type: boolean }
    ShiftPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ShiftSummary' }
        nextCursor: { type: [string, 'null'] }
    CashMovement:
      type: object
      required: [id, kind, amountCents, reason, staffId, occurredAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/CashMovementKind' }
        amountCents: { $ref: '#/components/schemas/AnyCents' }
        reason: { $ref: '#/components/schemas/CashMovementReason' }
        note: { type: [string, 'null'] }
        staffId: { type: string, format: uuid }
        approverStaffId: { type: [string, 'null'], format: uuid }
        occurredAt: { type: string, format: date-time }
    ShiftNote:
      type: object
      required: [staffId, note, createdAt]
      properties:
        staffId: { type: string, format: uuid }
        note: { type: string }
        createdAt: { type: string, format: date-time }
    ZReport:
      type: object
      description: M4 brief section 4.5. Tax by rate is net of refunds, from stored amounts.
      required: [saleCount, grossCents, discountCents, netCents, taxes, refundCount, refundCents, voidCount, voidCents, prepaidCollectedCents, cashInCents, cashOutCents, movements]
      properties:
        saleCount: { type: integer }
        grossCents: { type: integer }
        discountCents: { type: integer }
        netCents: { type: integer }
        taxes:
          type: array
          items: { $ref: '#/components/schemas/TaxByRate' }
        refundCount: { type: integer }
        refundCents: { type: integer }
        voidCount: { type: integer }
        voidCents: { type: integer }
        prepaidCollectedCents: { type: integer, description: '0 until orders in Sprint 6' }
        cashInCents: { type: integer }
        cashOutCents: { type: integer }
        movements:
          type: array
          description: Total per kind and reason
          items:
            type: object
            required: [kind, reason, amountCents]
            properties:
              kind: { $ref: '#/components/schemas/CashMovementKind' }
              reason: { $ref: '#/components/schemas/CashMovementReason' }
              amountCents: { type: integer }
    ShiftDetail:
      allOf:
        - { $ref: '#/components/schemas/ShiftSummary' }
        - type: object
          required: [openCount, movements, notes]
          properties:
            openCount: { $ref: '#/components/schemas/CashCount' }
            closeCount:
              oneOf:
                - { $ref: '#/components/schemas/CashCount' }
                - { type: 'null' }
            movements:
              type: array
              items: { $ref: '#/components/schemas/CashMovement' }
            notes:
              type: array
              items: { $ref: '#/components/schemas/ShiftNote' }
            zReport:
              oneOf:
                - { $ref: '#/components/schemas/ZReport' }
                - { type: 'null' }
    LocalDate:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: A calendar day at the branch
      examples: ['2026-11-02']
    StockProducedPayload:
      type: object
      description: Payload of `stock.produced`. The record `id` is the lot ID. M5 brief 4.1.
      required: [variantId, quantity, producedOn, staffId]
      additionalProperties: false
      properties:
        variantId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 9999 }
        producedOn: { $ref: '#/components/schemas/LocalDate' }
        staffId: { type: string, format: uuid }
    WasteReason:
      type: string
      enum: [BURNT, EXPIRED, DAMAGED, UNSOLD]
    StockWastedPayload:
      type: object
      description: Payload of `stock.wasted`. Oldest lots first unless `lotId` names one.
      required: [variantId, quantity, reason, staffId]
      additionalProperties: false
      properties:
        variantId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 9999 }
        reason: { $ref: '#/components/schemas/WasteReason' }
        lotId: { type: [string, 'null'], format: uuid }
        staffId: { type: string, format: uuid }
    StockCountedPayload:
      type: object
      description: Payload of `stock.counted`. The server works out each difference from its own on-hand. M5 brief 4.6.
      required: [staffId, lines]
      additionalProperties: false
      properties:
        staffId: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [variantId, counted]
            additionalProperties: false
            properties:
              variantId: { type: string, format: uuid }
              counted: { type: integer, minimum: 0, maximum: 999999 }
    BranchLot:
      type: object
      required: [id, variantId, producedOn, quantityLeft]
      properties:
        id: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        producedOn: { $ref: '#/components/schemas/LocalDate' }
        quantityLeft: { type: integer }
    BranchStock:
      type: object
      required: [generatedAt, lots, shortages]
      properties:
        generatedAt: { type: string, format: date-time }
        lots:
          type: array
          items: { $ref: '#/components/schemas/BranchLot' }
        shortages:
          type: array
          description: Units sold with no lot to take from, per variant
          items:
            type: object
            required: [variantId, quantity]
            properties:
              variantId: { type: string, format: uuid }
              quantity: { type: integer }
    StockLevel:
      type: object
      required: [branchId, variantId, productName, variantName, onHand, freshUnits, dayOldUnits, wasteDueUnits]
      properties:
        branchId: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        productName: { type: string }
        variantName: { type: string }
        onHand: { type: integer, description: 'Sum of the ledger; negative when more was sold than entered' }
        freshUnits: { type: integer }
        dayOldUnits: { type: integer }
        wasteDueUnits: { type: integer }
    StockEventKind:
      type: string
      enum: [PRODUCTION, SALE, REFUND_RETURN, WASTE, TRANSFER_OUT, TRANSFER_IN, COUNT_ADJUST]
    StockEvent:
      type: object
      required: [id, kind, quantity, occurredAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/StockEventKind' }
        quantity: { type: integer, description: 'Signed' }
        lotId: { type: [string, 'null'], format: uuid }
        referenceType: { type: [string, 'null'] }
        referenceId: { type: [string, 'null'], format: uuid }
        staffId: { type: [string, 'null'], format: uuid }
        occurredAt: { type: string, format: date-time }
    StockEventPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StockEvent' }
        nextCursor: { type: [string, 'null'] }
    WasteEntry:
      type: object
      required: [id, branchId, variantId, productName, variantName, quantity, reason, staffId, occurredAt]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        productName: { type: string }
        variantName: { type: string }
        quantity: { type: integer }
        reason: { $ref: '#/components/schemas/WasteReason' }
        staffId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        costCents: { type: [integer, 'null'], description: 'Unit cost when wasted; null when none was set' }
    WastePage:
      type: object
      required: [items, nextCursor, totalCostCents]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WasteEntry' }
        nextCursor: { type: [string, 'null'] }
        totalCostCents: { type: integer, description: 'Over the whole filter, not the page' }
    TransferStatus:
      type: string
      enum: [SENT, RECEIVED]
    TransferLine:
      type: object
      required: [variantId, productName, variantName, producedOn, quantitySent]
      properties:
        variantId: { type: string, format: uuid }
        productName: { type: string }
        variantName: { type: string }
        producedOn: { $ref: '#/components/schemas/LocalDate' }
        quantitySent: { type: integer }
        quantityReceived: { type: [integer, 'null'] }
    Transfer:
      type: object
      required: [id, fromBranchId, toBranchId, status, sentByStaffId, sentAt, flagged, lines]
      properties:
        id: { type: string, format: uuid }
        fromBranchId: { type: string, format: uuid }
        toBranchId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/TransferStatus' }
        sentByStaffId: { type: string, format: uuid }
        sentAt: { type: string, format: date-time }
        receivedByStaffId: { type: [string, 'null'], format: uuid }
        receivedAt: { type: [string, 'null'], format: date-time }
        flagged: { type: boolean }
        lines:
          type: array
          items: { $ref: '#/components/schemas/TransferLine' }
    TransferPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Transfer' }
        nextCursor: { type: [string, 'null'] }
    TransferCreate:
      type: object
      required: [fromBranchId, toBranchId, lines]
      additionalProperties: false
      properties:
        fromBranchId: { type: string, format: uuid }
        toBranchId: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [variantId, quantity]
            additionalProperties: false
            properties:
              variantId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 9999 }
    TransferReceive:
      type: object
      required: [lines]
      additionalProperties: false
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 200
          description: One row per line of the transfer
          items:
            type: object
            required: [variantId, producedOn, quantityReceived]
            additionalProperties: false
            properties:
              variantId: { type: string, format: uuid }
              producedOn: { $ref: '#/components/schemas/LocalDate' }
              quantityReceived: { type: integer, minimum: 0, maximum: 9999 }
    StockCheck:
      type: object
      required: [checkedAt, rowsChecked, mismatches]
      properties:
        checkedAt: { type: [string, 'null'], format: date-time }
        rowsChecked: { type: integer }
        mismatches: { type: integer }
    DayOldRule:
      type: object
      required: [productId, categoryId, categoryName, productName, isActive, dayOldDiscountAfterDays, dayOldDiscountBp, dayOldWasteAfterDays]
      properties:
        productId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        categoryName: { type: string }
        productName: { type: string }
        isActive: { type: boolean }
        dayOldDiscountAfterDays: { $ref: '#/components/schemas/DayOldDays' }
        dayOldDiscountBp: { type: [integer, 'null'], minimum: 1, maximum: 10000 }
        dayOldWasteAfterDays: { $ref: '#/components/schemas/DayOldDays' }
    DayOldRuleSet:
      type: object
      required: [productIds, dayOldDiscountAfterDays, dayOldDiscountBp, dayOldWasteAfterDays]
      additionalProperties: false
      properties:
        productIds:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string, format: uuid }
        dayOldDiscountAfterDays: { $ref: '#/components/schemas/DayOldDays' }
        dayOldDiscountBp: { type: [integer, 'null'], minimum: 1, maximum: 10000 }
        dayOldWasteAfterDays: { $ref: '#/components/schemas/DayOldDays' }
    VariantCost:
      type: object
      required: [variantId, productName, variantName, categoryName, priceCents, costCents]
      properties:
        variantId: { type: string, format: uuid }
        productName: { type: string }
        variantName: { type: string }
        categoryName: { type: string }
        priceCents: { $ref: '#/components/schemas/Cents' }
        costCents: { type: [integer, 'null'] }
    Weekdays:
      type: integer
      minimum: 0
      maximum: 127
      description: Bit set, Monday = 1, Tuesday = 2 ... Sunday = 64. 31 is Monday to Friday. 0 for a pre-order.
    PickupTime:
      type: string
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      examples: ['07:30']
    Customer:
      type: object
      required: [id, name, phone, rfc, notes, isActive, balanceCents]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: [string, 'null'] }
        rfc: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        isActive: { type: boolean }
        balanceCents: { type: integer, description: 'Prepaid balance; negative when the customer owes' }
    CustomerCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: [string, 'null'], pattern: '^[0-9+ ]{7,20}$' }
        rfc: { type: [string, 'null'], pattern: '^[A-ZÑ&]{3,4}\d{6}[A-Z0-9]{3}$' }
        notes: { type: [string, 'null'], maxLength: 500 }
    CustomerUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: [string, 'null'], pattern: '^[0-9+ ]{7,20}$' }
        rfc: { type: [string, 'null'], pattern: '^[A-ZÑ&]{3,4}\d{6}[A-Z0-9]{3}$' }
        notes: { type: [string, 'null'], maxLength: 500 }
        isActive: { type: boolean }
    PrepaidKind:
      type: string
      enum: [PAYMENT, PICKUP, MISSED, ADJUSTMENT]
    PrepaidEntry:
      type: object
      required: [id, kind, amountCents, ticketId, occurredAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/PrepaidKind' }
        amountCents: { type: integer, description: 'Signed' }
        ticketId: { type: [string, 'null'], format: uuid }
        occurredAt: { type: string, format: date-time }
    CustomerDetail:
      allOf:
        - { $ref: '#/components/schemas/Customer' }
        - type: object
          required: [orders, entries]
          properties:
            orders:
              type: array
              items: { $ref: '#/components/schemas/CustomerOrder' }
            entries:
              type: array
              description: The last 100, newest first
              items: { $ref: '#/components/schemas/PrepaidEntry' }
    OrderKind:
      type: string
      enum: [STANDING, ONE_OFF]
    OrderStatus:
      type: string
      enum: [ACTIVE, PAUSED, ENDED]
    MissedRule:
      type: string
      enum: [CHARGE, NO_CHARGE]
    OrderLineInput:
      type: object
      required: [variantId, quantity]
      additionalProperties: false
      properties:
        variantId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 9999 }
    OrderUpdate:
      type: object
      required: [weekdays, startDate, pickupTime, missedRule, lines]
      additionalProperties: false
      properties:
        weekdays: { $ref: '#/components/schemas/Weekdays' }
        startDate: { $ref: '#/components/schemas/LocalDate' }
        endDate:
          oneOf:
            - { $ref: '#/components/schemas/LocalDate' }
            - { type: 'null' }
        pickupTime: { $ref: '#/components/schemas/PickupTime' }
        missedRule: { $ref: '#/components/schemas/MissedRule' }
        note: { type: [string, 'null'], maxLength: 500 }
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/OrderLineInput' }
    OrderCreate:
      allOf:
        - { $ref: '#/components/schemas/OrderUpdate' }
        - type: object
          required: [customerId, branchId, kind]
          properties:
            customerId: { type: string, format: uuid }
            branchId: { type: string, format: uuid }
            kind: { $ref: '#/components/schemas/OrderKind' }
    CustomerOrder:
      type: object
      required: [id, customerId, customerName, branchId, kind, weekdays, startDate, endDate, pickupTime, missedRule, status, pausedFrom, pausedUntil, note, lines, skips]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        customerName: { type: string }
        branchId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/OrderKind' }
        weekdays: { $ref: '#/components/schemas/Weekdays' }
        startDate: { $ref: '#/components/schemas/LocalDate' }
        endDate:
          oneOf:
            - { $ref: '#/components/schemas/LocalDate' }
            - { type: 'null' }
        pickupTime: { $ref: '#/components/schemas/PickupTime' }
        missedRule: { $ref: '#/components/schemas/MissedRule' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        pausedFrom:
          oneOf:
            - { $ref: '#/components/schemas/LocalDate' }
            - { type: 'null' }
        pausedUntil:
          oneOf:
            - { $ref: '#/components/schemas/LocalDate' }
            - { type: 'null' }
        note: { type: [string, 'null'] }
        lines:
          type: array
          items:
            type: object
            required: [variantId, productName, variantName, quantity]
            properties:
              variantId: { type: string, format: uuid }
              productName: { type: string }
              variantName: { type: string }
              quantity: { type: integer }
        skips:
          type: array
          items: { $ref: '#/components/schemas/LocalDate' }
    TicketStatus:
      type: string
      enum: [PENDING, PICKED_UP, MISSED, SKIPPED]
    OrderTicketLine:
      type: object
      required: [lineNo, variantId, productName, variantName, quantity, unitPriceCents, ivaRateId, ivaBp, iepsRateId, iepsBp]
      properties:
        lineNo: { type: integer }
        variantId: { type: string, format: uuid }
        productName: { type: string }
        variantName: { type: string }
        quantity: { type: integer }
        unitPriceCents: { $ref: '#/components/schemas/Cents' }
        ivaRateId: { type: string, format: uuid }
        ivaBp: { $ref: '#/components/schemas/BasisPoints' }
        iepsRateId: { type: [string, 'null'], format: uuid }
        iepsBp: { $ref: '#/components/schemas/BasisPoints' }
    OrderTicket:
      type: object
      description: One due day of an order, priced the day it was made. A pickup sale must copy its lines (M6 brief 4.4).
      required: [id, orderId, branchId, customerId, customerName, customerPhone, balanceCents, dueDate, pickupTime, status, totalCents, saleId, lines]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        customerName: { type: string }
        customerPhone: { type: [string, 'null'] }
        balanceCents: { type: integer, description: 'The customer''s balance when this was read' }
        dueDate: { $ref: '#/components/schemas/LocalDate' }
        pickupTime: { $ref: '#/components/schemas/PickupTime' }
        status: { $ref: '#/components/schemas/TicketStatus' }
        totalCents: { $ref: '#/components/schemas/AnyCents' }
        saleId: { type: [string, 'null'], format: uuid }
        lines:
          type: array
          items: { $ref: '#/components/schemas/OrderTicketLine' }
    BranchTickets:
      type: object
      required: [generatedAt, today, items]
      properties:
        generatedAt: { type: string, format: date-time }
        today: { $ref: '#/components/schemas/LocalDate' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderTicket' }
    PickList:
      type: object
      required: [date, totals, tickets]
      properties:
        date: { $ref: '#/components/schemas/LocalDate' }
        totals:
          type: array
          items:
            type: object
            required: [variantId, productName, variantName, quantity]
            properties:
              variantId: { type: string, format: uuid }
              productName: { type: string }
              variantName: { type: string }
              quantity: { type: integer }
        tickets:
          type: array
          items: { $ref: '#/components/schemas/OrderTicket' }
    OrderPrepaidPayload:
      type: object
      description: Payload of `order.prepaid`. The record `id` is the prepaid entry ID. Cash in the open shift (M6 brief 4.3).
      required: [customerId, shiftId, amountCents, staffId]
      additionalProperties: false
      properties:
        customerId: { type: string, format: uuid }
        shiftId: { type: string, format: uuid }
        amountCents:
          allOf: [{ $ref: '#/components/schemas/AnyCents' }]
          minimum: 1
        staffId: { type: string, format: uuid }
    SalesGroup:
      type: string
      enum: [day, hour, branch, device, cashier, product, taxRate]
    SalesReportRow:
      type: object
      required: [key, label, saleCount, quantity, grossCents, discountCents, netCents, cashCents, prepaidCents, refundCents, baseCents, taxCents]
      properties:
        key: { type: string, description: 'A day, an hour (00-23), an id, or a tax rate such as IVA:1600' }
        label: { type: string }
        saleCount: { type: integer }
        quantity: { type: [integer, 'null'], description: 'Units, for products only' }
        grossCents: { type: integer }
        discountCents: { type: integer }
        netCents: { type: integer, description: 'What the sales came to, before refunds' }
        cashCents: { type: integer }
        prepaidCents: { type: integer, description: 'Order pickups paid from a balance' }
        refundCents: { type: integer }
        baseCents: { type: [integer, 'null'], description: 'Tax rows only, net of refunds' }
        taxCents: { type: [integer, 'null'], description: 'Tax rows only, net of refunds' }
    SalesReport:
      type: object
      required: [from, to, groupBy, items, totals]
      properties:
        from: { $ref: '#/components/schemas/LocalDate' }
        to: { $ref: '#/components/schemas/LocalDate' }
        groupBy: { $ref: '#/components/schemas/SalesGroup' }
        items:
          type: array
          items: { $ref: '#/components/schemas/SalesReportRow' }
        totals: { $ref: '#/components/schemas/SalesReportRow' }
    StockReportRow:
      type: object
      required: [branchId, branchName, variantId, productName, variantName, produced, sold, dayOldSold, returned, wasted, transferredIn, transferredOut, adjusted, onHand, wasteCostCents]
      properties:
        branchId: { type: string, format: uuid }
        branchName: { type: string }
        variantId: { type: string, format: uuid }
        productName: { type: string }
        variantName: { type: string }
        produced: { type: integer }
        sold: { type: integer }
        dayOldSold: { type: integer }
        returned: { type: integer }
        wasted: { type: integer }
        transferredIn: { type: integer }
        transferredOut: { type: integer }
        adjusted: { type: integer }
        onHand: { type: integer, description: 'At the end of the last day' }
        wasteCostCents: { type: [integer, 'null'] }
    StockReport:
      type: object
      required: [from, to, items]
      properties:
        from: { $ref: '#/components/schemas/LocalDate' }
        to: { $ref: '#/components/schemas/LocalDate' }
        items:
          type: array
          items: { $ref: '#/components/schemas/StockReportRow' }
    OrdersReport:
      type: object
      required: [from, to, tickets, balances]
      properties:
        from: { $ref: '#/components/schemas/LocalDate' }
        to: { $ref: '#/components/schemas/LocalDate' }
        tickets:
          type: array
          items:
            type: object
            required: [date, status, count, totalCents]
            properties:
              date: { $ref: '#/components/schemas/LocalDate' }
              status: { $ref: '#/components/schemas/TicketStatus' }
              count: { type: integer }
              totalCents: { type: integer }
        balances:
          type: array
          description: Lowest first, so who owes comes first
          items:
            type: object
            required: [customerId, name, phone, balanceCents]
            properties:
              customerId: { type: string, format: uuid }
              name: { type: string }
              phone: { type: [string, 'null'] }
              balanceCents: { type: integer }
    Dashboard:
      type: object
      required: [date, compareDate, netCents, saleCount, averageTicketCents, refundCents, compareNetCents, compareSaleCount, wasteCostCents, wasteUnits, flaggedShifts, prepaidCollectedCents, customersOwing, hours, topProducts, days, branches]
      properties:
        date: { $ref: '#/components/schemas/LocalDate' }
        compareDate: { $ref: '#/components/schemas/LocalDate' }
        netCents: { type: integer, description: 'Sales minus refunds' }
        saleCount: { type: integer }
        averageTicketCents: { type: integer }
        refundCents: { type: integer }
        compareNetCents: { type: integer }
        compareSaleCount: { type: integer }
        wasteCostCents: { type: integer }
        wasteUnits: { type: integer }
        flaggedShifts: { type: integer }
        prepaidCollectedCents: { type: integer }
        customersOwing: { type: integer }
        hours:
          type: array
          items:
            type: object
            required: [hour, netCents, saleCount]
            properties:
              hour: { type: integer, minimum: 0, maximum: 23 }
              netCents: { type: integer }
              saleCount: { type: integer }
        topProducts:
          type: array
          maxItems: 5
          items:
            type: object
            required: [variantId, label, quantity, netCents]
            properties:
              variantId: { type: string, format: uuid }
              label: { type: string }
              quantity: { type: integer }
              netCents: { type: integer }
        days:
          type: array
          description: The 14 days ending on `date`, days with sales only
          items:
            type: object
            required: [date, netCents, saleCount]
            properties:
              date: { $ref: '#/components/schemas/LocalDate' }
              netCents: { type: integer }
              saleCount: { type: integer }
        branches:
          type: array
          items:
            type: object
            required: [branchId, name, netCents, saleCount]
            properties:
              branchId: { type: string, format: uuid }
              name: { type: string }
              netCents: { type: integer }
              saleCount: { type: integer }
    OvenFeeRule:
      type: object
      required: [id, name, baseCents, perKgCents, isActive, sortOrder, variantId, productName, variantName, ivaRateId, ivaBp, iepsRateId, iepsBp]
      description: A dish type. The fee is `baseCents + round(perKgCents × weightGrams / 1000)`, sold with the variant below (M8).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        baseCents: { $ref: '#/components/schemas/AnyCents' }
        perKgCents: { $ref: '#/components/schemas/AnyCents' }
        isActive: { type: boolean }
        sortOrder: { type: integer }
        variantId: { type: string, format: uuid }
        productName: { type: string }
        variantName: { type: string }
        ivaRateId: { type: string, format: uuid }
        ivaBp: { $ref: '#/components/schemas/BasisPoints' }
        iepsRateId: { type: [string, 'null'], format: uuid }
        iepsBp: { $ref: '#/components/schemas/BasisPoints' }
    OvenFeeRuleCreate:
      type: object
      required: [name, baseCents, perKgCents, ivaRateId]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        baseCents: { type: integer, minimum: 0, maximum: 10000000 }
        perKgCents: { type: integer, minimum: 0, maximum: 10000000 }
        ivaRateId: { type: string, format: uuid }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
    OvenFeeRuleUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        baseCents: { type: integer, minimum: 0, maximum: 10000000 }
        perKgCents: { type: integer, minimum: 0, maximum: 10000000 }
        isActive: { type: boolean }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
    OvenStatus:
      type: string
      enum: [RECEIVED, IN_OVEN, READY, PICKED_UP]
    OvenTicket:
      type: object
      required: [id, branchId, tag, customerName, phone, description, ruleId, weightGrams, feeCents, requestedAt, status, receivedAt, inOvenAt, readyAt, pickedUpAt, paid]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        tag: { type: string }
        customerName: { type: string }
        phone: { type: [string, 'null'] }
        description: { type: string }
        ruleId: { type: string, format: uuid }
        weightGrams: { type: integer }
        feeCents: { $ref: '#/components/schemas/AnyCents' }
        requestedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/OvenStatus' }
        receivedAt: { type: string, format: date-time }
        inOvenAt: { type: [string, 'null'], format: date-time }
        readyAt: { type: [string, 'null'], format: date-time, description: 'The actual ready time, for the customer (M8.3)' }
        pickedUpAt: { type: [string, 'null'], format: date-time }
        paid: { type: boolean }
    OvenBoard:
      type: object
      required: [generatedAt, today, enabled, rules, tickets]
      properties:
        generatedAt: { type: string, format: date-time }
        today: { $ref: '#/components/schemas/LocalDate' }
        enabled: { type: boolean }
        rules:
          type: array
          items: { $ref: '#/components/schemas/OvenFeeRule' }
        tickets:
          type: array
          items: { $ref: '#/components/schemas/OvenTicket' }
    OvenTicketList:
      type: object
      required: [branches, items]
      properties:
        branches:
          type: array
          items: { $ref: '#/components/schemas/OvenBranchState' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OvenTicket' }
    OvenBranchState:
      type: object
      description: Whether a branch takes dishes for the oven (M8.5)
      required: [branchId, name, enabled]
      properties:
        branchId: { type: string, format: uuid }
        name: { type: string }
        enabled: { type: boolean }
    OvenReceivedPayload:
      type: object
      description: Payload of `oven.received`. The record `id` is the oven ticket ID. The fee must match the rule (M8.1).
      required: [tag, customerName, description, ruleId, weightGrams, feeCents, requestedAt, staffId]
      additionalProperties: false
      properties:
        tag: { type: string, minLength: 1, maxLength: 10 }
        customerName: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: [string, 'null'], pattern: '^[0-9+ ]{7,20}$' }
        description: { type: string, minLength: 1, maxLength: 200 }
        ruleId: { type: string, format: uuid }
        weightGrams: { type: integer, minimum: 1, maximum: 100000 }
        feeCents: { $ref: '#/components/schemas/AnyCents' }
        requestedAt: { type: string, format: date-time }
        staffId: { type: string, format: uuid }
        feeSaleId: { type: [string, 'null'], format: uuid, description: 'The fee sale, when paid at drop-off' }
    OvenStatusPayload:
      type: object
      description: Payload of `oven.status`. A step never goes back; the furthest one stands.
      required: [ticketId, status, staffId]
      additionalProperties: false
      properties:
        ticketId: { type: string, format: uuid }
        status: { type: string, enum: [IN_OVEN, READY] }
        staffId: { type: string, format: uuid }
    OvenPickedUpPayload:
      type: object
      description: Payload of `oven.picked_up`. The fee is paid exactly once, at drop-off or here.
      required: [ticketId, staffId]
      additionalProperties: false
      properties:
        ticketId: { type: string, format: uuid }
        staffId: { type: string, format: uuid }
        feeSaleId: { type: [string, 'null'], format: uuid, description: 'The fee sale, when paid at pickup' }
    SaleStatus:
      type: string
      enum: [COMPLETED, PARTIALLY_REFUNDED, REFUNDED, VOIDED]
    SaleDiscount:
      type: object
      required: [lineNo, kind, value, cents, reason, note, approverStaffId]
      properties:
        lineNo: { type: [integer, 'null'], description: 'Null for a ticket discount' }
        kind: { $ref: '#/components/schemas/DiscountKind' }
        value: { type: integer }
        cents: { $ref: '#/components/schemas/AnyCents' }
        reason: { $ref: '#/components/schemas/DiscountReason' }
        note: { type: [string, 'null'] }
        approverStaffId: { type: [string, 'null'], format: uuid }
    SaleLine:
      type: object
      required: [dayOld, fullPriceCents, lineNo, variantId, productName, variantName, quantity, unitPriceCents, grossCents, lineDiscountCents, orderDiscountCents, netCents, ivaRateId, ivaBp, iepsRateId, iepsBp, baseCents, iepsCents, ivaCents, refundedQuantity]
      properties:
        dayOld: { type: boolean }
        fullPriceCents: { $ref: '#/components/schemas/Cents' }
        lineNo: { type: integer }
        variantId: { type: string, format: uuid }
        productName: { type: string }
        variantName: { type: string }
        quantity: { type: integer }
        unitPriceCents: { $ref: '#/components/schemas/Cents' }
        grossCents: { $ref: '#/components/schemas/AnyCents' }
        lineDiscountCents: { $ref: '#/components/schemas/AnyCents' }
        orderDiscountCents: { $ref: '#/components/schemas/AnyCents' }
        netCents: { $ref: '#/components/schemas/AnyCents' }
        ivaRateId: { type: string, format: uuid }
        ivaBp: { $ref: '#/components/schemas/BasisPoints' }
        iepsRateId: { type: [string, 'null'], format: uuid }
        iepsBp: { $ref: '#/components/schemas/BasisPoints' }
        baseCents: { $ref: '#/components/schemas/AnyCents' }
        iepsCents: { $ref: '#/components/schemas/AnyCents' }
        ivaCents: { $ref: '#/components/schemas/AnyCents' }
        refundedQuantity: { type: integer, minimum: 0 }
        refundedCents: { $ref: '#/components/schemas/AnyCents' }
    TaxByRate:
      type: object
      required: [kind, rateBp, baseCents, taxCents]
      properties:
        kind: { $ref: '#/components/schemas/TaxKind' }
        rateBp: { $ref: '#/components/schemas/BasisPoints' }
        baseCents:
          allOf: [{ $ref: '#/components/schemas/AnyCents' }]
          description: The amount this rate applies to (for IVA, base plus IEPS)
        taxCents: { $ref: '#/components/schemas/AnyCents' }
    Payment:
      type: object
      required: [method, amountCents, tenderedCents, changeCents]
      properties:
        method: { $ref: '#/components/schemas/PaymentMethod' }
        amountCents: { $ref: '#/components/schemas/AnyCents' }
        tenderedCents: { $ref: '#/components/schemas/AnyCents' }
        changeCents: { $ref: '#/components/schemas/AnyCents' }
    VoidedLine:
      type: object
      required: [variantId, quantity, unitPriceCents, voidedAt, staffId]
      properties:
        variantId: { type: string, format: uuid }
        quantity: { type: integer }
        unitPriceCents: { $ref: '#/components/schemas/Cents' }
        voidedAt: { type: string, format: date-time }
        staffId: { type: string, format: uuid }
    RefundLine:
      type: object
      required: [lineNo, quantity, amountCents, baseCents, iepsCents, ivaCents, restock]
      properties:
        lineNo: { type: integer }
        quantity: { type: integer }
        amountCents: { $ref: '#/components/schemas/AnyCents' }
        baseCents: { $ref: '#/components/schemas/AnyCents' }
        iepsCents: { $ref: '#/components/schemas/AnyCents' }
        ivaCents: { $ref: '#/components/schemas/AnyCents' }
        restock: { type: boolean }
    Refund:
      type: object
      required: [id, kind, reason, note, deviceId, staffId, approverStaffId, occurredAt, totalCents, lines]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/RefundKind' }
        reason: { $ref: '#/components/schemas/RefundReason' }
        note: { type: [string, 'null'] }
        deviceId: { type: string, format: uuid }
        staffId: { type: string, format: uuid }
        approverStaffId: { type: [string, 'null'], format: uuid }
        occurredAt: { type: string, format: date-time }
        totalCents: { $ref: '#/components/schemas/AnyCents' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/RefundLine' }
    SaleSummary:
      type: object
      required: [id, folio, branchId, deviceId, cashierStaffId, cashierName, occurredAt, status, lineCount, grossCents, discountCents, totalCents, refundedCents]
      properties:
        id: { type: string, format: uuid }
        folio: { $ref: '#/components/schemas/Folio' }
        branchId: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        cashierStaffId: { type: string, format: uuid }
        cashierName: { type: string }
        occurredAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/SaleStatus' }
        lineCount: { type: integer }
        grossCents: { $ref: '#/components/schemas/AnyCents' }
        discountCents: { $ref: '#/components/schemas/AnyCents' }
        totalCents: { $ref: '#/components/schemas/AnyCents' }
        refundedCents: { $ref: '#/components/schemas/AnyCents' }
    Sale:
      allOf:
        - { $ref: '#/components/schemas/SaleSummary' }
        - type: object
          required: [folioNumber, shiftId, receivedAt, lines, discounts, taxes, payments, voidedLines, refunds]
          properties:
            folioNumber: { type: integer }
            shiftId: { type: [string, 'null'], format: uuid }
            receivedAt: { type: string, format: date-time }
            lines:
              type: array
              items: { $ref: '#/components/schemas/SaleLine' }
            discounts:
              type: array
              items: { $ref: '#/components/schemas/SaleDiscount' }
            taxes:
              type: array
              description: Sum of the lines' tax parts by kind and rate, before refunds
              items: { $ref: '#/components/schemas/TaxByRate' }
            payments:
              type: array
              items: { $ref: '#/components/schemas/Payment' }
            voidedLines:
              type: array
              items: { $ref: '#/components/schemas/VoidedLine' }
            refunds:
              type: array
              items: { $ref: '#/components/schemas/Refund' }
    SalePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SaleSummary' }
        nextCursor: { type: [string, 'null'] }
