          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [from], additionalProperties: false, properties: { from: { $ref: '#/components/schemas/LocalDate' }, until: { oneOf: [ { $ref: '#/components/schemas/LocalDate' }, { type: 'null' } ] } } }
