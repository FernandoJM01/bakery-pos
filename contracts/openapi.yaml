      tags: [orders]
      operationId: createCustomer
      summary: Creates a customer; writes `customer.created`
      x-permission: orders.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerCreate' }
