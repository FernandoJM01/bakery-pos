# Local development only. Never use these credentials anywhere else.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos_dev_only
      POSTGRES_DB: pos_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pos_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pos_dev_data:
